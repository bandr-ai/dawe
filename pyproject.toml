[project]
name = "dawe"
version = "0.1.0"
description = "An agent skill that turns your data and model failures into tested weight patches."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
gpu = ["modal"]  # launches the jobs in gpu/ and the agent lab; the jobs install their own pinned stack remotely
dev = ["pytest>=8", "safetensors", "numpy"]  # the last two only cross-check our stdlib safetensors code

[project.urls]
Repository = "https://github.com/bandr-ai/dawe"

[project.scripts]
dawe = "dawe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"skills/dawe" = "dawe/_skills/dawe"
