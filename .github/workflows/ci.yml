name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: uv run pytest -q
      # data-dependent checks: pinned dataset revision, split manifest, every gold answer survives every harness
      - run: uv run dawe fetch
      - run: uv run dawe splits
      - run: uv run dawe roundtrip
