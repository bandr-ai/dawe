name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      # Fetch first so dataset-dependent tests run rather than skip.
      - run: uv run dawe fetch
      - run: uv run pytest -q
      - run: uv run dawe splits
      # tests/test_release.py checks every gold/harness roundtrip, with one strict
      # expected failure for the existing simple_307 native-format label mismatch.
